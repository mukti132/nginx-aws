
name: Deploy Static Website to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o ConnectTimeout=15 \
              "$EC2_USER@$EC2_HOST" \
              "echo SSH connection successful"

      - name: Install Nginx and Rsync
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "sudo apt-get update &&
             sudo apt-get install -y nginx rsync &&
             sudo systemctl enable nginx"

      - name: Copy Website Files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -az --delete \
            site/ \
            "$EC2_USER@$EC2_HOST:/home/ubuntu/site/"

      - name: Deploy Website to Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "sudo rsync -a --delete /home/ubuntu/site/ /var/www/html/ &&
             sudo nginx -t &&
             sudo systemctl restart nginx"

      - name: Verify Website
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --show-error --silent \
            "http://$EC2_HOST/"
